version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ebd_postgres_1
    environment:
      POSTGRES_DB: ebd_db
      POSTGRES_USER: ebd_user
      POSTGRES_PASSWORD: ebd_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ebd_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebd_user -d ebd_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: ebd_web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://ebd_user:ebd_pass@postgres:5432/ebd_db
      SECRET_KEY: super-secret-key-change-in-production
      FLASK_APP: wsgi.py
      FLASK_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebd_net
    restart: on-failure

volumes:
  pgdata:

networks:
  ebd_net:
    driver: bridge
