<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – EBD</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#0f1623;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:#151d2e;border:1px solid #1e2d44;border-radius:16px;padding:40px;width:100%;max-width:400px;}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.8rem;background:linear-gradient(135deg,#2d9cdb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
.login-logo p{color:#64748b;text-align:center;font-size:.85rem;margin:6px 0 28px;}
label{display:block;font-size:.8rem;font-weight:500;color:#64748b;margin-bottom:6px;}
input{width:100%;padding:10px 14px;background:#0d1420;border:1px solid #1e2d44;border-radius:8px;color:#e2e8f0;font-size:.875rem;transition:.2s;font-family:'DM Sans',sans-serif;}
input:focus{outline:none;border-color:#2d9cdb;}
.form-group{margin-bottom:16px;}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#2d9cdb,#1e7fb8);border:none;border-radius:8px;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:8px;font-family:'DM Sans',sans-serif;}
.btn-login:hover{opacity:.9;}
.alert{padding:10px 14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;border-radius:8px;font-size:.875rem;margin-bottom:16px;}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <h1>✝ EBD</h1>
    <p>Sistema de Controle de Frequência</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required placeholder="seu@email.com" autofocus>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="password" required placeholder="••••••••">
    </div>
    <button class="btn-login" type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
